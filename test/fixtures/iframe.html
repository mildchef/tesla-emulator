<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cross-origin iframe fixture</title>
<style>html, body { margin: 0; } iframe { display: block; border: 0; width: 340px; height: 240px; }</style>
</head>
<body>
<iframe id="f" allow="autoplay; fullscreen"></iframe>
<script>
  const other = new URLSearchParams(location.search).get('other');
  document.getElementById('f').src = other + '/video.html';
</script>
</body>
</html>
